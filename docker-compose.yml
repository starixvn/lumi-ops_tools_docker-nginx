version: '3'

services:
  nginx:
    image: nginx:1.15-alpine
    restart: unless-stopped
    volumes:
      - ./data/nginx.conf:/etc/nginx/nginx.conf
      - ./data/nginx:/etc/nginx/conf.d
      - ./data/certs:/etc/certs
      - ./data/logs:/var/log/nginx
    ports:
      - '80:80'
      - '443:443'
      - '16379:16379'
      - '9999:9999'
