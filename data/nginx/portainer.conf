upstream portainer {
    server 10.10.50.16:9000;
}

server {
    listen 443 ssl;
    server_name portainer.lumigame.com;

    ssl_certificate /etc/certs/lumigame.com/fullchain.pem;
    ssl_certificate_key /etc/certs/lumigame.com/privkey.pem;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://portainer/;
    }
    
    location /ws/ {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_pass http://portainer/ws/;
    }
}

server {
    listen 80;
    server_name portainer.lumigame.com;
    server_tokens off;
    
    location / {
        return 301 https://$host$request_uri;
    }
}