stream {
    upstream redis_servers {
        server 10.10.50.16:6001 weight=5;
        server 10.10.50.16:6002 weight=5;
        server 10.10.50.16:6003;
        server 10.10.50.16:6004;
        server 10.10.50.16:6005;
        server 10.10.50.16:6006;
    }

    server { # simple load balancing
        listen          16379;
        server_name     redis.lumigame.com;

        location / {
            proxy_pass      redis_servers;
        }
    }
}