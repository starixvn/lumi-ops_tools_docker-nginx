upstream sedie_nodes {
    ip_hash;
    server 10.5.10.14:8082;
}

upstream vip_sedie_nodes {
    ip_hash;
    server 127.0.0.1:8083;
}


server {
    listen 80 
    server_name game-proxy.lumigame.com;

    location /sedie/ {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_pass http://sedie_nodes/socket.io/;
    }

    location /vipsedie/ {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_pass http://vip_sedie_nodes/socket.io/;
    }
}